# Jicofo HOCON configuration. See reference.conf in /usr/share/jicofo/jicofo.jar for
#available options, syntax, and default values.
jicofo {
  authentication: {
    enabled: true
    type: XMPP
    login-url: "meet.pathment.me"
  }
  xmpp: {
    client: {
      client-proxy: "focus.meet.pathment.me"
      xmpp-domain: "meet.pathment.me"
      domain: "auth.meet.pathment.me"
      username: "focus"
      password: "REPLACE_AT_INSTALL"
    }
    trusted-domains: [ "recorder.meet.pathment.me" ]
  }
  bridge: {
    brewery-jid: "JvbBrewery@internal.auth.meet.pathment.me"
  }
}
